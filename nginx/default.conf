# Used only by the production build (docker-compose.prod.yml: frontend/Dockerfile.prod → nginx).
# The default compose setup serves the frontend from the Vite dev server.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA fallback
        add_header Cache-Control no-cache;  # index.html names the hashed files below
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The graph streams over server-sent events: no buffering, and a long read timeout,
    # because a deep graph can go a while between iterations.
    location /api/ {
        proxy_pass http://knowledge-farm-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
