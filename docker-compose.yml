services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    restart: unless-stopped
    build:
      context: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app      # hot reload; anything outside app/ needs a rebuild
      - gen_images:/data/gen        # images drawn for reports (IMAGE_DIR)
    # ports:
    #   - "${HOST_PORT:-8000}:8000"
    healthcheck:   # the worker waits for this: the API creates the tables on startup
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      default:
        # Reach the API by this name, never "api": every project on the shared Caddy network
        # has a service called api, and that name resolves to any of them.
        aliases: [knowledge-farm-api]
      caddy_proxy:
    labels:
      # Required: an empty `caddy` label merges this reverse_proxy into Caddy's global block,
      # which makes caddy-docker-proxy reject the config for every site on the host.
      caddy: ${API_DOMAIN:?set API_DOMAIN in .env (on feib.nl use docker-compose.prod.yml)}
      caddy.reverse_proxy: "{{upstreams 8000}}"
      caddy_docker_network: ${CADDY_NETWORK}

  # Runs queued background jobs. No hot reload, so a job survives edits and API restarts;
  # after changing job code: docker compose restart worker
  worker:
    restart: unless-stopped
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - gen_images:/data/gen
    networks: [default, caddy_proxy]   # same as api, so vonk resolves the same way

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
    depends_on: [api]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}     # vite.config.js allows this hostname
    volumes:
      - ./frontend/src:/app/src
    networks: [default, caddy_proxy]
    labels:
      caddy: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy_docker_network: ${CADDY_NETWORK}

volumes:
  postgres_data:
  gen_images:

networks:
  caddy_proxy:
    external: true
    name: ${CADDY_NETWORK}
